name: Refresh public GitHub widgets
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: profile-stats
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Generate public statistics and arcade assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/sync-profile.mjs
      - name: Publish updated widgets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets/github-data.json assets/github-mixer*.svg assets/contribution-invaders*.svg docs/github-data.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public GitHub statistics'
            git push
          fi
      - name: Refresh the arcade data on GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent
